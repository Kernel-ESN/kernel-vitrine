<button
  class="btn btn--secondary filters-open"
  type="button"
  aria-haspopup="dialog"
  data-testid="filters-toggle"
  (click)="show()"
>
  <app-icon [data]="icons.open" [size]="20" />
  {{ text.open }}
  @if (count()) {
    <span class="filters-open__count" data-testid="filters-count">{{ count() }}</span>
  }
</button>

<!-- Panneau en colonne sur grand écran, fenêtre modale sur téléphone : un seul contenu. -->
<dialog #panel class="filters" aria-labelledby="filters-title" data-testid="filters">
  <div class="filters__head">
    <h2 id="filters-title" class="filters__title">{{ text.title }}</h2>
    @if (count()) {
      <button
        class="filters__reset"
        type="button"
        data-testid="clear-filters"
        (click)="cleared.emit()"
      >
        {{ text.reset }}
      </button>
    }
    <button
      class="filters__close"
      type="button"
      data-testid="filters-close"
      [attr.aria-label]="text.close"
      (click)="hide()"
    >
      <app-icon [data]="icons.close" [size]="24" />
    </button>
  </div>

  <div class="filters__groups">
    @for (group of groups(); track group.key) {
      @if (group.options.length) {
        <fieldset class="group">
          <legend class="group__title">{{ group.label }}</legend>
          @for (option of group.options; track option.id) {
            <label class="option">
              <input
                [type]="group.single ? 'radio' : 'checkbox'"
                [attr.name]="group.single ? 'filter-' + group.key : null"
                [attr.data-testid]="'facet-' + group.key + '-' + (option.id || 'any')"
                [checked]="option.checked"
                [disabled]="group.single && option.count === 0 && !option.checked"
                (change)="toggle(group, option.id, $any($event.target).checked)"
              />
              <span class="option__label">{{ option.label }}</span>
              @if (option.count !== null) {
                <span class="option__count" aria-hidden="true">{{ option.count }}</span>
                <span class="visually-hidden">{{ text.countLabel(option.count) }}</span>
              }
            </label>
          }
          @if (group.expandable) {
            <button
              class="group__more"
              type="button"
              [attr.aria-expanded]="!group.hidden"
              [attr.data-testid]="'facet-more-' + group.key"
              (click)="toggleGroup(group.key)"
            >
              {{ group.hidden ? text.more(group.hidden) : text.less }}
            </button>
          }
        </fieldset>
      }
    }
  </div>

  <div class="filters__foot">
    <button
      class="btn btn--primary btn--block"
      type="button"
      data-testid="filters-apply"
      (click)="hide()"
    >
      {{ text.show(total()) }}
    </button>
  </div>
</dialog>
